<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Noobies Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              accent: '#f97316',
            },
            fontFamily: {
              'curly': ['"Great Vibes"', 'cursive'],
              'sans': ['Inter', 'sans-serif'],
              'coolvetica': ['"Coolvetica"', '"Arial Narrow"', 'Arial', 'sans-serif'],
              'poppins': ['Poppins', 'sans-serif'],
              'birds': ['"Birds of Paradise"', '"Brush Script MT"', '"Segoe Script"', 'cursive'],
              'display': ['"Syne"', 'sans-serif'],
              'cursive': ['Sacramento', 'cursive'],
              'mono': ['monospace'], 
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;600&family=Poppins:wght@700&family=Sacramento&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'Coolvetica';
        src: url('/assets/fonts/Coolvetica Rg.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Coolvetica';
        src: url('/assets/fonts/Coolvetica Hv Comp.otf') format('opentype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Aston Script';
        src: url('/assets/fonts/Aston Script.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Birds of Paradise';
        src: url('/assets/fonts/Birds of Paradise + PERSONAL USE ONLY.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      /* Global Reset */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #f6f3ee;
        color: #111111;
        
        /* STRICT NO VERTICAL SCROLL */
        overflow: hidden; 
        overscroll-behavior: none;
        position: fixed; /* Lock viewport */
      }

      body {
        font-family: 'Inter', sans-serif;
      }

      /* Reverted Selection Color to Black */
      ::selection {
        background-color: #000000;
        color: white;
      }

      .font-cursive {
        font-family: 'Sacramento', cursive;
      }
      .font-curly {
        font-family: 'Great Vibes', cursive;
      }
      .font-display {
        font-family: 'Syne', sans-serif;
      }
      .font-coolvetica {
        font-family: 'Coolvetica', 'Arial Narrow', Arial, sans-serif;
        font-weight: 400;
      }
      .font-poppins {
        font-family: 'Poppins', sans-serif;
        font-weight: 700;
      }
      .font-aston {
        font-family: 'Aston Script', cursive;
        font-weight: 400;
      }
      .font-birds {
        font-family: 'Birds of Paradise', 'Brush Script MT', 'Segoe Script', cursive;
        font-weight: 400;
      }
      
      .writing-vertical {
        writing-mode: vertical-rl;
        text-orientation: mixed;
      }
      
      /* Utilities */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
